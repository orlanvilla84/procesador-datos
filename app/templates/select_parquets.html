<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF--8">
    <title>Paso 2: Seleccionar Tablas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h2 class="mb-0">Paso 2: Seleccionar Tablas a Procesar</h2>
            <a href="{{ url_for('reset') }}" class="btn btn-sm btn-light">Empezar de Nuevo</a>
        </div>
        <div class="card-body p-4 p-md-5">
            <p class="text-muted">Se han generado las siguientes tablas base a partir de tu Excel. Selecciona cuáles deseas procesar con un esquema.</p>
            
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            
            <form method="post">
                <div class="row g-3 mt-3">
                    {% for parquet in parquets %}
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="form-check border rounded-3 p-3 h-100">
                            <input class="form-check-input" type="checkbox" name="parquet_checkbox" value="{{ parquet }}" id="check-{{ loop.index }}">
                            <label class="form-check-label" for="check-{{ loop.index }}">
                                {{ parquet }}
                            </label>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <div class="text-center mt-5">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Cargar Esquemas <i class="bi bi-arrow-right"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
