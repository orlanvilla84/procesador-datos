<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Procesando...</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"></head><body><div class="container mt-5"><div class="card shadow text-center"><div class="card-body p-5"><h1 class="card-title text-primary">Procesando tus Archivos</h1><p class="lead">La tarea de Spark se está ejecutando en segundo plano. Esto puede tardar varios minutos.</p><div class="spinner-border text-primary my-4" role="status" style="width: 3rem; height: 3rem;"><span class="visually-hidden">Loading...</span></div><p class="text-muted">No cierres esta ventana. Serás redirigido automáticamente.</p><div id="error-message" class="alert alert-danger mt-4" style="display: none; white-space: pre-wrap; text-align: left;"></div></div></div></div><script>document.addEventListener('DOMContentLoaded',function(){const e=document.getElementById("error-message");const t=()=>{fetch('/status').then(t=>t.json()).then(o=>{if("completed"===o.status||"failed"===o.status)window.location.href=o.results_url;else setTimeout(t,3e3)}).catch(t=>{e.textContent="Error de conexión con el servidor.",e.style.display="block",console.error("Error fetching status:",t)})};t()});</script></body></html>
